<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Sample IP addressing and connection check plan</title>
  <desc id="desc">A sample table gives two PCs and a router addresses on the 192.168.10.0/24 network. A checklist proposes inspecting settings, pinging the gateway, and pinging a peer. No tests have been run.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#829ab3" stroke-opacity=".09"/></pattern></defs>
  <rect width="1200" height="680" fill="#111923"/>
  <rect width="1200" height="680" fill="url(#grid)"/>
  <rect x="22" y="22" width="1156" height="636" rx="20" fill="none" stroke="#607a89" stroke-opacity=".45"/>
  <g font-family="Arial,sans-serif">
    <text x="72" y="91" fill="#9cc4cc" font-size="17" font-weight="700" letter-spacing="4">ADDRESSING / CHECK PLAN</text>
    <text x="72" y="147" fill="#f2f7f7" font-size="47" font-weight="700">A simple plan you can verify.</text>
    <rect x="72" y="184" width="1056" height="220" rx="16" fill="#1a2934" stroke="#58707e"/>
    <path d="M72 242h1056M72 296h1056M72 350h1056M282 184v220M625 184v220M852 184v220" stroke="#476371"/>
    <rect x="72" y="184" width="1056" height="58" rx="16" fill="#25434b"/>
    <path d="M72 242h1056" stroke="#68939b"/>
    <text x="96" y="220" fill="#b8e8e8" font-size="17" font-weight="700">DEVICE</text>
    <text x="307" y="220" fill="#b8e8e8" font-size="17" font-weight="700">SAMPLE IP / PREFIX</text>
    <text x="650" y="220" fill="#b8e8e8" font-size="17" font-weight="700">GATEWAY</text>
    <text x="876" y="220" fill="#b8e8e8" font-size="17" font-weight="700">ROLE</text>
    <text x="96" y="276" fill="#f2f7f7" font-size="18">PC 1</text>
    <text x="307" y="276" fill="#d3e5e6" font-size="18">192.168.10.10/24</text>
    <text x="650" y="276" fill="#d3e5e6" font-size="18">192.168.10.1</text>
    <text x="876" y="276" fill="#d3e5e6" font-size="18">Local device</text>
    <text x="96" y="330" fill="#f2f7f7" font-size="18">PC 2</text>
    <text x="307" y="330" fill="#d3e5e6" font-size="18">192.168.10.11/24</text>
    <text x="650" y="330" fill="#d3e5e6" font-size="18">192.168.10.1</text>
    <text x="876" y="330" fill="#d3e5e6" font-size="18">Local device</text>
    <text x="96" y="384" fill="#f2f7f7" font-size="18">Router</text>
    <text x="307" y="384" fill="#d3e5e6" font-size="18">192.168.10.1/24</text>
    <text x="650" y="384" fill="#d3e5e6" font-size="18">—</text>
    <text x="876" y="384" fill="#d3e5e6" font-size="18">LAN gateway</text>
    <text x="72" y="454" fill="#9cc4cc" font-size="17" font-weight="700" letter-spacing="2">PROPOSED CONNECTION CHECKS</text>
    <rect x="72" y="474" width="334" height="112" rx="14" fill="#203742" stroke="#6f9cab"/>
    <rect x="433" y="474" width="334" height="112" rx="14" fill="#203742" stroke="#6f9cab"/>
    <rect x="794" y="474" width="334" height="112" rx="14" fill="#203742" stroke="#6f9cab"/>
    <text x="95" y="508" fill="#9ce0d3" font-size="16" font-weight="700">01 / INSPECT SETTINGS</text>
    <text x="95" y="542" fill="#f2f7f7" font-size="21" font-weight="700">Check IP and mask</text>
    <text x="95" y="567" fill="#b8cdd0" font-size="14">Windows: ipconfig / Linux: ip addr</text>
    <text x="456" y="508" fill="#9ce0d3" font-size="16" font-weight="700">02 / TEST THE GATEWAY</text>
    <text x="456" y="542" fill="#f2f7f7" font-size="21" font-weight="700">Ping 192.168.10.1</text>
    <text x="456" y="567" fill="#b8cdd0" font-size="14">Check access to the gateway</text>
    <text x="817" y="508" fill="#9ce0d3" font-size="16" font-weight="700">03 / TEST THE PEER</text>
    <text x="817" y="542" fill="#f2f7f7" font-size="21" font-weight="700">Ping 192.168.10.11</text>
    <text x="817" y="567" fill="#b8cdd0" font-size="14">Check local device reachability</text>
    <text x="72" y="627" fill="#b8cdd0" font-size="15">Sample addresses and planned checks only — these are not captured configuration or ping results.</text>
  </g>
</svg>
