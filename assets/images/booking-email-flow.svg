<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Customer booking confirmation flow</title>
  <desc id="desc">A service booking passes through application code and an email API before reaching the customer's inbox. The code and email API step was investigated.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#142c32"/>
      <stop offset="1" stop-color="#0c171b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#background)"/>
  <g fill="none" stroke="#34535b" opacity=".65">
    <path d="M0 72h640M0 144h640M0 216h640M0 288h640M80 0v360M160 0v360M240 0v360M320 0v360M400 0v360M480 0v360M560 0v360"/>
  </g>
  <text x="34" y="44" fill="#c4e7e2" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">BOOKING CONFIRMATION FLOW</text>
  <path d="M198 171h30m184 0h30" stroke="#8bd9c8" stroke-width="3" stroke-linecap="round"/>
  <path d="m220 164 8 7-8 7m214-14 8 7-8 7" fill="none" stroke="#8bd9c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial,sans-serif">
    <rect x="28" y="110" width="170" height="120" rx="14" fill="#e5f2ef"/>
    <text x="46" y="142" fill="#42756f" font-size="13" font-weight="700">01 / CUSTOMER</text>
    <text x="46" y="174" fill="#17373a" font-size="23" font-weight="700">Booking</text>
    <text x="46" y="200" fill="#526c6e" font-size="15">Form submitted</text>
    <rect x="228" y="102" width="184" height="136" rx="14" fill="#f8e5ca" stroke="#e9a969" stroke-width="3"/>
    <text x="246" y="137" fill="#95572e" font-size="13" font-weight="700">02 / INVESTIGATED</text>
    <text x="246" y="169" fill="#49311e" font-size="22" font-weight="700">Code + API</text>
    <text x="246" y="196" fill="#725942" font-size="15">Email sending step</text>
    <rect x="442" y="110" width="170" height="120" rx="14" fill="#e5f2ef"/>
    <text x="460" y="142" fill="#42756f" font-size="13" font-weight="700">03 / CUSTOMER</text>
    <text x="460" y="174" fill="#17373a" font-size="23" font-weight="700">Inbox</text>
    <text x="460" y="200" fill="#526c6e" font-size="15">Confirmation email</text>
    <text x="34" y="316" fill="#a9c8c4" font-size="14">Illustrative process diagram · no customer data or error logs shown</text>
  </g>
</svg>
