  <rect width="660" height="470" rx="20" fill="url(#bg)"/>
  <g fill="none" stroke="#35545a" opacity=".55"><path d="M0 60h660M0 120h660M0 180h660M0 240h660M0 300h660M0 360h660M0 420h660M60 0v470M120 0v470M180 0v470M240 0v470M300 0v470M360 0v470M420 0v470M480 0v470M540 0v470M600 0v470"/></g>
