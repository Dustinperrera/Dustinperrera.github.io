    <rect x="445" y="90" width="190" height="98" rx="15" fill="#e9f5f0"/>
    <text x="540" y="129" fill="#24545a" font-size="17" font-weight="700">Contact</text><text x="540" y="157" fill="#5b7475" font-size="14">Message form</text>
    <path d="M120 188v33m210-33v33m210-33v33M120 221h420M330 221v23" fill="none" stroke="#80c5b6" stroke-width="3" stroke-linecap="round"/>
    <rect x="70" y="245" width="520" height="103" rx="16" fill="#f6e5cb" stroke="#e7aa70" stroke-width="3"/>
    <text x="330" y="284" fill="#7a4d30" font-size="15" font-weight="700">ANTI-SPAM SAFEGUARDS</text>
