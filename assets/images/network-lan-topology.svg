<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Small LAN topology concept</title>
  <desc id="desc">Two sample PCs connect to a switch. The switch connects to a router acting as the gateway. This is an illustrative plan, not a configured network.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#829ab3" stroke-opacity=".09"/></pattern>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#1e323e"/><stop offset="1" stop-color="#17222e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="680" fill="#111923"/>
  <rect width="1200" height="680" fill="url(#grid)"/>
  <rect x="22" y="22" width="1156" height="636" rx="20" fill="none" stroke="#607a89" stroke-opacity=".45"/>
  <text x="72" y="91" fill="#9cc4cc" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">05 / NETWORKING CONCEPT</text>
  <text x="72" y="147" fill="#f2f7f7" font-family="Arial,sans-serif" font-size="48" font-weight="700">Small LAN, clear connections.</text>
  <rect x="916" y="67" width="210" height="39" rx="19" fill="#254b51" stroke="#6bbdc1"/>
  <text x="1021" y="92" fill="#b8e9e7" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1">ILLUSTRATIVE PLAN</text>
  <path d="M600 288V327M600 410V455H282V481M600 455H918V481" fill="none" stroke="#91c9d2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="600" cy="327" r="8" fill="#a9e6dc" filter="url(#glow)"/>
  <circle cx="600" cy="327" r="5" fill="#b9f7eb"/>
  <circle cx="600" cy="455" r="5" fill="#b9f7eb"/>
  <circle cx="282" cy="481" r="5" fill="#b9f7eb"/>
  <circle cx="918" cy="481" r="5" fill="#b9f7eb"/>
  <g font-family="Arial,sans-serif">
    <rect x="450" y="191" width="300" height="97" rx="18" fill="url(#surface)" stroke="#8cc2d7" stroke-width="2"/>
    <circle cx="495" cy="238" r="23" fill="#254d5d" stroke="#9cd4df"/>
    <path d="M483 239h24m-18-8-7 8 7 8m12-16 7 8-7 8" fill="none" stroke="#c7f1f2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="533" y="228" fill="#f1f8f8" font-size="24" font-weight="700">Router</text>
    <text x="533" y="255" fill="#a9c8cc" font-size="17">Gateway: 192.168.10.1</text>
    <rect x="450" y="327" width="300" height="83" rx="18" fill="url(#surface)" stroke="#73c8b8" stroke-width="2"/>
    <rect x="476" y="351" width="48" height="34" rx="8" fill="#255447" stroke="#a4e8d1"/>
    <circle cx="489" cy="368" r="3" fill="#c8f6e8"/><circle cx="502" cy="368" r="3" fill="#c8f6e8"/><circle cx="515" cy="368" r="3" fill="#c8f6e8"/>
    <text x="541" y="360" fill="#f1f8f8" font-size="24" font-weight="700">Switch</text>
    <text x="541" y="386" fill="#a9c8cc" font-size="17">Joins devices on the LAN</text>
    <rect x="138" y="481" width="288" height="103" rx="18" fill="url(#surface)" stroke="#8cc2d7" stroke-width="2"/>
    <rect x="163" y="507" width="47" height="35" rx="5" fill="#294d62" stroke="#a9d9eb"/><path d="M174 548h25m-13-6v6" stroke="#a9d9eb" stroke-width="2"/>
    <text x="230" y="521" fill="#f1f8f8" font-size="23" font-weight="700">PC 1</text>
    <text x="230" y="551" fill="#a9c8cc" font-size="18">192.168.10.10/24</text>
    <rect x="774" y="481" width="288" height="103" rx="18" fill="url(#surface)" stroke="#8cc2d7" stroke-width="2"/>
    <rect x="799" y="507" width="47" height="35" rx="5" fill="#294d62" stroke="#a9d9eb"/><path d="M810 548h25m-13-6v6" stroke="#a9d9eb" stroke-width="2"/>
    <text x="866" y="521" fill="#f1f8f8" font-size="23" font-weight="700">PC 2</text>
    <text x="866" y="551" fill="#a9c8cc" font-size="18">192.168.10.11/24</text>
    <text x="72" y="620" fill="#b6cbcd" font-size="16">Same subnet: PC 1 ↔ switch ↔ PC 2</text>
    <text x="1128" y="620" fill="#b6cbcd" text-anchor="end" font-size="16">Other networks: through the router</text>
  </g>
</svg>
